services:
  - type: web
    name: windops-api
    runtime: node
    branch: main
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        fromService:
          type: web
          name: windops-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: windops-web
    runtime: static
    branch: main
    buildCommand: cd web && npm ci && npm run build -- --define "WINDOPS_API_URL='${NG_APP_API_URL}'"
    staticPublishPath: web/dist/web/browser
    envVars:
      - key: NG_APP_API_URL
        fromService:
          type: web
          name: windops-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
