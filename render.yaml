services:
  # 1. NestJS Backend Web Service
  - type: web
    name: windops-api
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        # Injetaremos dinamicamente depois de criar o site estático
        value: "*"

  # 2. Angular Static Site
  - type: web
    name: windops-web
    env: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist/windops-app/browser
    envVars:
      - key: NG_APP_API_URL
        fromService:
          type: web
          name: windops-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
